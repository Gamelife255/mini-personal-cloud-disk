server:
  port: 8080

spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/cloud_disk?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 465
    # 发送邮件的邮箱账号
    username: youremail 
    # 这里修改为邮箱的授权码 
    password: XXXXXXXXXX # 这是一个授权码，不是邮箱密码，切记不要泄露
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

  # SQL初始化配置
  sql:
    init:
      mode: always

  # 文件上传配置
  servlet:
    multipart:
    #  单个最大请求大小
      max-file-size: 500MB
      #  总最大请求大小（多个文件）
      max-request-size: 1000MB

# 自定义：网盘文件存储路径，需要手动创建目录，或者修改为其他路径
# Windows: E:/disk/upload/
# Linux:   /opt/cloud-disk/upload/
disk:
  upload:
    path: /opt/cloud-disk/upload/


# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

