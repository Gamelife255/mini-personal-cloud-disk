# Cloud Disk — Nginx 配置
# 复制此文件到 /etc/nginx/sites-available/cloud-disk
# 然后执行: sudo ln -s /etc/nginx/sites-available/cloud-disk /etc/nginx/sites-enabled/
# 最后执行: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # 替换为你的域名，多个用空格分隔: example.com www.example.com

    # 前端静态文件
    root /opt/cloud-disk/frontend;
    index index.html;

    # 前端路由 (Vue Router history 模式)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 Spring Boot 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文件大小限制
        client_max_body_size 500m;
    }
}
